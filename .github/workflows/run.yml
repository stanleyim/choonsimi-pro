name: choonsimi-daily

permissions:
  contents: write

on:
  schedule:
    - cron: '10 11 * * 1-5'   # KST 20:10 (UTC 11:10) 월~금
  workflow_dispatch:

concurrency:
  group: choonsimi-lock
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install deps
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install holidays

    # ─────────────────────────────
    # KST 기준 공휴일 체크 (timezone-aware)
    # ─────────────────────────────
    - name: Check Holiday (KRX, KST)
      id: check_holiday
      run: |
        python - << 'EOF' > /tmp/holiday_check.txt
from datetime import datetime, timezone, timedelta
import holidays

KST = timezone(timedelta(hours=9))
today = datetime.now(KST).date()

kr = holidays.KR(years=today.year)
is_holiday = today in kr

print(f"KST Date: {today}")
print(f"Is Holiday: {is_holiday}")
print("true" if is_holiday else "false")
EOF

        SKIP_VALUE=$(tail -1 /tmp/holiday_check.txt)
        echo "skip=$SKIP_VALUE" >> $GITHUB_OUTPUT
        cat /tmp/holiday_check.txt

    - name: Skip if Holiday
      if: steps.check_holiday.outputs.skip == 'true'
      run: echo "📅 KRX Holiday (KST) - Skipping." && exit 0

    # ─────────────────────────────
    # 데이터 수집
    # ─────────────────────────────
    - name: Fetch Market Data
      env:
        KIS_APP_KEY:    ${{ secrets.KIS_APP_KEY }}
        KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
      run: python fetch_data.py

    - name: Fetch Market Flow
      env:
        KIS_APP_KEY:    ${{ secrets.KIS_APP_KEY }}
        KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
      run: python fetch_kis_flow.py

    - name: Fetch News
      env:
        NAVER_CLIENT_ID:     ${{ secrets.NAVER_CLIENT_ID }}
        NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
      run: python fetch_news.py

    # ─────────────────────────────
    # 엔진 실행
    # ─────────────────────────────
    - name: Run Engine
      env:
        DART_API_KEY:   ${{ secrets.DART_API_KEY }}
        PRO_MODE: "true"
      run: python engine.py

    # ─────────────────────────────
    # 결과 검증 (구조 + 데이터)
    # ─────────────────────────────
    - name: Validate Output
      run: |
        echo "🔍 파일 존재 검사"
        test -f result.json      || (echo "❌ result.json 없음" && exit 1)
        test -f history.csv      || (echo "❌ history.csv 없음" && exit 1)
        test -f market_flow.json || (echo "❌ market_flow.json 없음" && exit 1)
        test -f news_scores.json || (echo "❌ news_scores.json 없음" && exit 1)

        echo "🔍 JSON 검증"
        python - << 'EOF'
import json, sys

try:
    d = json.load(open('result.json'))

    assert "top20" in d, "top20 없음"
    assert "regime" in d, "regime 없음"
    assert "date" in d, "date 없음"

    if len(d["top20"]) > 0:
        print(f"✅ top20: {len(d['top20'])} | regime: {d['regime']}")
        if "top5_core" in d:
            print(f"✅ top5_core: {len(d['top5_core'])}")
    else:
        print("⚠️ top20 비어있음")

    print("OK")

except Exception as e:
    print(f"❌ 검증 실패: {e}")
    sys.exit(1)
EOF

        echo "✅ 검증 완료"

    # ─────────────────────────────
    # 커밋 + push (재시도 포함)
    # ─────────────────────────────
    - name: Commit & Push
      run: |
        git config --global user.name  "choonsimi-bot"
        git config --global user.email "bot@choonsimi.com"

        git add result.json market_flow.json news_scores.json
        git add history.csv signal_history.csv
        git add regime_cache.json 2>/dev/null || true
        git add fundamental.json  2>/dev/null || true
        git add api/_private/     2>/dev/null || true

        if ! git diff --cached --quiet; then
          git commit -m "daily update $(date +'%Y-%m-%d')"

          success=false
          for i in 1 2 3; do
            if git push; then
              echo "✅ push 성공"
              success=true
              break
            else
              echo "⚠️ push 실패 ($i/3)"
              sleep 5
            fi
          done

          if [ "$success" = false ]; then
            echo "❌ push 최종 실패"
            exit 1
          fi

        else
          echo "ℹ️ 변경 없음"
        fi
