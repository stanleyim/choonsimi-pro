name: Daily Update

permissions:
  contents: write

on:
  schedule:
    - cron: '18 10 * * 1-5'   # ✅ KST 19 :18 (UTC 10:18) 월~금 (5필드)
  workflow_dispatch:

concurrency:
  group: choonsimi-lock
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install deps
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install holidays==0.47

    # ─────────────────────────────
    # KST 기준 공휴일 체크 (timezone-aware)
    # ─────────────────────────────
    - name: Check Holiday (KRX, KST)
      id: check_holiday
      run: |
        python - << 'EOF' > /tmp/holiday_check.txt
        from datetime import datetime, timezone, timedelta
        import holidays

        KST = timezone(timedelta(hours=9))
        today = datetime.now(KST).date()

        kr = holidays.KR(years=today.year)
        is_holiday = today in kr

        print(f"KST Date: {today}")
        print(f"Is Holiday: {is_holiday}")
        print("true" if is_holiday else "false")
        EOF

        SKIP_VALUE=$(tail -1 /tmp/holiday_check.txt)
        echo "skip=$SKIP_VALUE" >> $GITHUB_OUTPUT
        cat /tmp/holiday_check.txt

    - name: Skip if Holiday
      if: steps.check_holiday.outputs.skip == 'true'
      run: echo "📅 KRX Holiday (KST) - Skipping." && exit 0

    # ─────────────────────────────
    # 데이터 수집
    # ─────────────────────────────
    - name: Fetch Market Data
      env:
        KIS_APP_KEY:    ${{ secrets.KIS_APP_KEY }}
        KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
      run: python fetch_data.py

    - name: Validate history.csv
      run: |
        test -s history.csv || (echo "❌ history.csv empty/missing" && exit 1)
        LINES=$(wc -l < history.csv)
        if [ "$LINES" -lt 50 ]; then
          echo "❌ history.csv too small ($LINES lines)" && exit 1
        fi
        echo "✅ history.csv valid ($LINES lines)"

    - name: Fetch Market Flow
      env:
        KIS_APP_KEY:    ${{ secrets.KIS_APP_KEY }}
        KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
      run: python fetch_kis_flow.py

    - name: Fetch News
      env:
        NAVER_CLIENT_ID:     ${{ secrets.NAVER_CLIENT_ID }}
        NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
      run: python fetch_news.py

    # ─────────────────────────────
    # ✅ 수정: UTF-8 BOM 처리 추가
    # ─────────────────────────────
    - name: Validate flow & news
      run: |
        python - << 'EOF'
        import json, sys
        for f in ["market_flow.json", "news_scores.json"]:
            try:
                # ✅ BOM 문자 자동 처리 (utf-8-sig)
                d = json.load(open(f, encoding='utf-8-sig'))
                if not d:
                    raise Exception(f"{f} empty")
            except Exception as e:
                print(f"❌ {f} invalid: {e}")
                sys.exit(1)

        print("✅ flow/news valid")
        EOF

    # ─────────────────────────────
    # 엔진 실행
    # ─────────────────────────────
    - name: Run Engine
      env:
        DART_API_KEY:   ${{ secrets.DART_API_KEY }}
        PRO_MODE: "true"
      run: python engine/engine.py

    # ─────────────────────────────
    # 결과 검증 (✅ BOM 수정 최종 반영)
    # ─────────────────────────────
    - name: Validate Output
      run: |
        test -f result.json      || (echo "❌ result.json 없음" && exit 1)
        test -f history.csv      || (echo "❌ history.csv 없음" && exit 1)
        test -f market_flow.json || (echo "❌ market_flow.json 없음" && exit 1)
        test -f news_scores.json || (echo "❌ news_scores.json 없음" && exit 1)

        python - << 'EOF'
        import json, sys

        try:
            # ✅ result.json 도 BOM 처리 (utf-8-sig)
            d = json.load(open('result.json', encoding='utf-8-sig'))

            assert "top20" in d, "top20 없음"
            assert "regime" in d, "regime 없음"
            assert "date" in d, "date 없음"

            if len(d["top20"]) == 0:
                print("❌ CRITICAL: top20 empty")
                sys.exit(1)

            print(f"✅ top20: {len(d['top20'])} | regime: {d['regime']}")

            if "top5_core" in d:
                print(f"✅ top5_core: {len(d['top5_core'])}")
            if "entry_top5" in d:
                if len(d["entry_top5"]) == 0:
                    print("⚠️ entry_top5 empty")
                else:
                    print(f"✅ entry_top5: {len(d['entry_top5'])}")

            print("OK")

        except Exception as e:
            print(f"❌ 검증 실패: {e}")
            sys.exit(1)
        EOF

    # ─────────────────────────────
    # 커밋 + push (✅ 선택적 파일 오류 처리 완료)
    # ─────────────────────────────
    - name: Commit & Push
      run: |
        git config --global user.name  "choonsimi-bot"
        git config --global user.email "bot@choonsimi.com"

        git add result.json market_flow.json news_scores.json
        git add history.csv            2>/dev/null || true
        git add signal_history.csv     2>/dev/null || true
        git add regime_cache.json      2>/dev/null || true
        git add fundamental.json       2>/dev/null || true
        git add api/_private/          2>/dev/null || true

        if ! git diff --cached --quiet; then
          git commit -m "daily update $(date +'%Y-%m-%d')"

          success=false
          for i in 1 2 3; do
            if git push origin HEAD:${{ github.ref_name }}; then
              echo "✅ push 성공"
              success=true
              break
            else
              echo "⚠️ push 실패 ($i/3), 재시도..."
              sleep 5
            fi
          done

          if [ "$success" = false ]; then
            echo "❌ push 최종 실패"
            exit 1
          fi
        else
          echo "ℹ️ 변경 없음"
        fi
