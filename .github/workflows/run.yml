name: Daily Update

permissions:
  contents: write

on:
  schedule:
    - cron: '18 10 * * 1-5'   # KST 19:18 (UTC 10:18) 월~금
  workflow_dispatch:

concurrency:
  group: choonsimi-lock
  cancel-in-progress: true

jobs:
  run:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v5

    - name: Setup Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.11'

    - name: Install deps
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    # ── HOLIDAY CHECK ──────────────────────────────
    - name: Check Holiday (KRX, KST)
      id: check_holiday
      run: |
        python - << 'PYEOF' > /tmp/holiday_check.txt
        from datetime import datetime, timezone, timedelta
        import holidays

        KST = timezone(timedelta(hours=9))
        today = datetime.now(KST).date()
        kr = holidays.KR(years=today.year)
        is_holiday = today in kr

        print(f"KST Date: {today}")
        print(f"Is Holiday: {is_holiday}")
        print("true" if is_holiday else "false")
        PYEOF

        SKIP_VALUE=$(tail -1 /tmp/holiday_check.txt)
        echo "skip=$SKIP_VALUE" >> $GITHUB_OUTPUT
        cat /tmp/holiday_check.txt

    - name: Skip if Holiday
      if: steps.check_holiday.outputs.skip == 'true'
      run: echo "📅 KRX Holiday (KST) — Skipping." && exit 0

    # ── DATA LAYER ─────────────────────────────────
    - name: Fetch Market Data
      if: steps.check_holiday.outputs.skip != 'true'
      env:
        KIS_APP_KEY:    ${{ secrets.KIS_APP_KEY }}
        KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
      run: python fetch_data.py

    - name: Validate history.csv
      if: steps.check_holiday.outputs.skip != 'true'
      run: |
        test -s history.csv || (echo "❌ history.csv empty/missing" && exit 1)
        LINES=$(wc -l < history.csv)
        if [ "$LINES" -lt 50 ]; then
          echo "❌ history.csv too small ($LINES lines)" && exit 1
        fi
        echo "✅ history.csv valid ($LINES lines)"

    - name: Fetch Market Flow
      if: steps.check_holiday.outputs.skip != 'true'
      env:
        KIS_APP_KEY:    ${{ secrets.KIS_APP_KEY }}
        KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
      run: python fetch_kis_flow.py

    - name: Fetch News
      if: steps.check_holiday.outputs.skip != 'true'
      env:
        NAVER_CLIENT_ID:     ${{ secrets.NAVER_CLIENT_ID }}
        NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
      run: python fetch_news.py

    - name: Validate flow & news
      if: steps.check_holiday.outputs.skip != 'true'
      run: |
        python - << 'PYEOF'
        import json, sys
        for f in ["market_flow.json", "news_scores.json"]:
            try:
                d = json.load(open(f, encoding='utf-8-sig'))
                if not d:
                    raise Exception(f"{f} empty")
            except Exception as e:
                print(f"❌ {f} invalid: {e}")
                sys.exit(1)
        print("✅ flow/news valid")
        PYEOF

    # ── ENGINE ─────────────────────────────────────
    - name: Run Engine
      if: steps.check_holiday.outputs.skip != 'true'
      env:
        KIS_APP_KEY:    ${{ secrets.KIS_APP_KEY }}
        KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
        DART_API_KEY:   ${{ secrets.DART_API_KEY }}
        PRO_MODE:       "true"
      run: python engine/engine.py

    # ── BACKFILL (signal_history 빈칸 자동 채움) ───
    - name: Backfill signal_history OHLC
      if: steps.check_holiday.outputs.skip != 'true'
      env:
        KIS_APP_KEY:    ${{ secrets.KIS_APP_KEY }}
        KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
      run: python backfill_ohlc.py

    - name: Backfill signal_history EXIT
      if: steps.check_holiday.outputs.skip != 'true'
      env:
        KIS_APP_KEY:    ${{ secrets.KIS_APP_KEY }}
        KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
      run: python backfill_exit.py

    # ── VALIDATION ─────────────────────────────────
    - name: Validate Output
      if: steps.check_holiday.outputs.skip != 'true'
      run: |
        python - << 'PYEOF'
        import json, sys
        try:
            d = json.load(open('result.json', encoding='utf-8-sig'))
            assert "top20"  in d, "top20 없음"
            assert "regime" in d, "regime 없음"
            assert "date"   in d, "date 없음"
            assert len(d["top20"]) > 0, "top20 비어있음"

            print(f"✅ top20:{len(d['top20'])} | regime:{d['regime']} | pro:{len(d.get('pro_top',[]))}")
            if not d.get("pro_signal"):
                print(f"⚠ {d.get('pro_no_signal',{}).get('message_ko','')}")
        except Exception as e:
            print(f"❌ 검증 실패: {e}")
            sys.exit(1)
        PYEOF

    # ── COMMIT ─────────────────────────────────────
    - name: Commit Results
      if: steps.check_holiday.outputs.skip != 'true'
      run: |
        git config user.name  "choonsimi-bot"
        git config user.email "bot@choonsimi.com"

        git add result.json market_flow.json news_scores.json
        git add history.csv signal_history.csv 2>/dev/null || true
        git add fundamental.json               2>/dev/null || true
        git add corp_map_cache.json            2>/dev/null || true

        if ! git diff --cached --quiet; then
          git commit -m "daily update $(date +'%Y-%m-%d')"
          for i in 1 2 3; do
            if git push origin HEAD:${{ github.ref_name }}; then
              echo "✅ push 성공"
              break
            else
              echo "⚠ push 실패 ($i/3), 재시도..."
              sleep 5
            fi
          done
        else
          echo "ℹ️ 변경 없음"
        fi
